; OpenMind wheeled robot: ESP32 firmware.
; Build:       pio run -e esp32dev
; Host tests:  pio test -e native
; Do not flash before the hardware validation (task SBX-090).

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    bblanchon/ArduinoJson@^7.2.0

[env:esp32dev]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    knolleary/PubSubClient@^2.8
build_flags =
    -Wall
    -Iinclude

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Iinclude
