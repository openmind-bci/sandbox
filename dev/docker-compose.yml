# Local MQTT broker for development (see docs/dev-broker.md).
# DEVELOPMENT ONLY: anonymous access without TLS.
name: openmind-sandbox-dev

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: openmind-mosquitto
    ports:
      - "1883:1883" # MQTT
      - "9001:9001" # MQTT over WebSocket
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
