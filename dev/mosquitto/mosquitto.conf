# Mosquitto configuration for LOCAL DEVELOPMENT ONLY.
#
# Anonymous access, no TLS: anyone who can reach these ports can publish
# commands. Never expose this broker beyond your machine or a trusted network.

persistence false
log_dest stdout

# MQTT over TCP (Python tools, ESP32 robot)
listener 1883
protocol mqtt
allow_anonymous true

# MQTT over WebSocket (browser tools)
listener 9001
protocol websockets
allow_anonymous true
